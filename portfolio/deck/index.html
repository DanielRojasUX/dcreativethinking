<template id="t-ema-context" data-bg="#FFFFFF">
  
  <header class="hd"><span class="kicker">Dionne's Catering</span><span class="title">Event Management App</span><span class="sub">Context</span></header>
  <div class="body" style="top:420px">
    <ul>
      <li>Dionne's Catering is a family catering business in Utah County, serving weddings, social celebrations and corporate events.</li>
      <li>I started working with them in 2023 on their branding and website. As demand grew, the bottleneck moved from marketing to operations.</li>
      <li>Every event lived in four disconnected tools: Word quotes, Square invoices, an Excel tracker and Google Calendar.</li>
      <li>The goal: what the client confirms and pays for is exactly what the kitchen prepares, without anyone typing an event twice.</li>
    </ul>
  </div>
</template>

<template id="t-ema-problem" data-bg="#FFFFFF">
  
  <header class="hd"><span class="kicker">Dionne's Catering</span><span class="title" data-focus>Event Management App</span><span class="sub">Problem Definition</span></header>
  <div class="body" style="top:400px">
    <p class="lead">Every event passes through three people and four tools:</p>
    <ul class="sub-ul">
      <li><b>Client</b> receives a Word quote, then pays a Square invoice</li>
      <li><b>Sales</b> types the same event into Square, the tracker and the calendar</li>
      <li><b>Production</b> reads the calendar as its only source of truth</li>
    </ul>
    <p class="lead">Across every booking, the event was:</p>
    <ul class="sub-ul">
      <li><b>Manual</b>: the same details typed up to four times</li>
      <li><b>Unconfirmed</b>: unpaid events could reach the calendar and paid ones could be missed</li>
      <li><b>Silent</b>: nothing confirmed that production had seen a new or changed event</li>
    </ul>
    <p class="lead">The result: logistics risk surfaced on event day, when it costs the most.</p>
  </div>
</template>

<template id="t-ema-statement" data-bg="#FFFFFF">
  
  <header class="hd"><span class="kicker">Dionne's Catering</span><span class="title">Event Management App</span><span class="sub">Problem Statement</span></header>
  <div class="body statement">
    <p>Sales and production need a single, shared record of every event, so that what the client confirms and pays for is exactly what the kitchen prepares, because today the same event is typed into disconnected tools and nobody is notified when it changes.</p>
    <p>Solving this removes logistics errors at the source, gives sales its time back for selling and gives the owner a real view of the pipeline.</p>
  </div>
</template>

<template id="t-ema-req" data-bg="#FFFFFF">
  
  <header class="hd"><span class="kicker">Dionne's Catering</span><span class="title">Event Management App</span><span class="sub">Requirements assessment</span></header>
  <div class="req">
    <div class="rh"><span>Focus Area</span><span>Initial Understanding</span></div>
    <div class="rr"><b>System Context</b><p>Quotes in Word, invoices and payments in Square, the pipeline in an Excel tracker and the production schedule in Google Calendar.</p></div>
    <div class="rr"><b>Current Constraints</b><p>A small team working from their phones, no budget for native apps, and payments must land in the business's own account.</p></div>
    <div class="rr"><b>Assumptions</b><p>Most logistics errors start when event details are copied between tools, not when they are first captured.</p></div>
    <div class="rr"><b>Success Criteria</b><p>Every paid event reaches the production calendar on its own, with no retyping and a confirmed acknowledgement from both teams.</p></div>
    <div class="rr"><b>Risks Identified</b><p>Payment notifications failing or arriving twice, calendar sync breaking, and text messages not reaching clients.</p></div>
  </div>
</template>
