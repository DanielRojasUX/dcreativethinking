<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ada + Nate · 06.12.2027</title>
<meta name="theme-color" content="#2f3d2c">
<link rel="preload" as="image" href="envelope.jpg?v=3">
<link rel="preload" as="image" href="seal.png?v=3">
<link rel="preload" as="image" href="photo.jpg?v=3">
<link rel="preload" as="font" type="font/woff2" href="fonts/pinyon-script-latin-400-normal.woff2" crossorigin>
<style>
  @font-face{font-family:'Pinyon Script';src:url(fonts/pinyon-script-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Cormorant Garamond';src:url(fonts/cormorant-garamond-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'Cormorant Garamond';src:url(fonts/cormorant-garamond-latin-400-italic.woff2) format('woff2');font-weight:400;font-style:italic;font-display:swap}
  @font-face{font-family:'Jost';src:url(fonts/jost-latin-300-normal.woff2) format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:'Jost';src:url(fonts/jost-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}

  :root{
    --white:#fff;
    --ink:#2d2a24;
    --ink-soft:#5f594d;
    --green:#3f4f37;
    --gold:#a88a4a;
    --serif:'Cormorant Garamond','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif;
    --sans:'Jost','Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-io:cubic-bezier(.65,0,.35,1);
    /* envelope.jpg is 1170 x 2096; point where the four flaps meet */
    --cx:49.72%;
    --cy:44.64%;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0e0e0e;overflow:hidden;-webkit-tap-highlight-color:transparent}
  body{display:flex;justify-content:center;font-family:var(--sans);color:var(--white)}
  button{font:inherit;color:inherit}

  .stage{position:relative;width:100%;max-width:480px;height:100dvh;overflow:hidden;background:#2f3d2c}

  /* ================= Language switch ================= */
  .lang{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;z-index:9;display:flex;gap:4px;align-items:center;
    font-size:10px;letter-spacing:.2em;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .lang button{appearance:none;background:none;border:0;padding:6px 4px;cursor:pointer;opacity:.6;border-bottom:1px solid transparent}
  .lang button[aria-pressed="true"]{opacity:1;border-bottom-color:currentColor}
  .lang span{opacity:.5}

  /* ================= Photo ================= */
  .photo{position:absolute;inset:0;background:url(photo.jpg?v=3) center 40%/cover no-repeat;transform:scale(1.12);filter:brightness(.55)}
  .is-open .photo{transform:scale(1);filter:brightness(.92);transition:transform 7s var(--ease-out) .2s,filter 2.4s ease .3s}
  .scrim{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 55%,rgba(0,0,0,.72) 100%)}

  /* ================= Main invitation ================= */
  .content{position:absolute;inset:0;pointer-events:none}
  .content a,.content button{pointer-events:auto}

  .slide{opacity:0;transition:transform 1.4s var(--ease-out),opacity 1.4s ease}
  .from-top{transform:translateY(-60px)}
  .from-bottom{transform:translateY(60px)}
  .from-left{transform:translate(-60px,-50%) rotate(180deg)}
  .from-right{transform:translate(60px,-50%)}
  .is-revealed .slide{opacity:1}
  .is-revealed .from-top,.is-revealed .from-bottom{transform:translateY(0)}
  .is-revealed .from-left{transform:translate(0,-50%) rotate(180deg)}
  .is-revealed .from-right{transform:translate(0,-50%)}
  .d1{transition-delay:.1s}.d2{transition-delay:.35s}.d3{transition-delay:.6s}.d5{transition-delay:2.2s}.d6{transition-delay:2.5s}

  .names{position:absolute;top:calc(env(safe-area-inset-top) + 9%);left:0;right:0;text-align:center;
    font-family:var(--serif);font-weight:500;font-size:clamp(17px,4.6vw,21px);letter-spacing:.32em;text-transform:uppercase;text-indent:.32em}
  .names small{display:block;margin-top:10px;font-family:var(--sans);font-weight:300;font-size:10px;letter-spacing:.42em;text-indent:.42em;opacity:.85}

  .side{position:absolute;top:50%;writing-mode:vertical-rl;font-weight:300;font-size:10px;letter-spacing:.46em;text-transform:uppercase;white-space:nowrap;opacity:.9}
  .side.left{left:18px}
  .side.right{right:18px}

  .mono{position:absolute;left:50%;top:37%;width:min(54%,240px);transform:translate(-50%,-50%)}
  .mono svg{width:100%;height:auto;overflow:visible;display:block}
  .mono .frame{fill:none;stroke:var(--white);stroke-width:1.1;stroke-dasharray:820;stroke-dashoffset:820}
  .mono .letter{font-family:'Pinyon Script',cursive;fill:var(--white);opacity:0;filter:blur(6px)}
  .mono .date{font-family:'Jost',sans-serif;font-weight:300;fill:var(--white);font-size:15px;letter-spacing:.18em;opacity:0}
  .is-revealed .mono .frame{stroke-dashoffset:0;transition:stroke-dashoffset 2.4s var(--ease-io) .3s}
  .is-revealed .mono .letter{opacity:1;filter:blur(0);transition:opacity 1.8s ease 1s,filter 1.8s ease 1s}
  .is-revealed .mono .letter.n{transition-delay:1.35s}
  .is-revealed .mono .date{opacity:.95;transition:opacity 1.2s ease 1.9s}

  .when{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 196px);left:0;right:0;text-align:center}
  .when .day{font-family:var(--serif);font-style:italic;font-size:clamp(20px,5.4vw,24px)}
  .when .meta{margin-top:8px;font-weight:300;font-size:10.5px;letter-spacing:.38em;text-indent:.38em;text-transform:uppercase;opacity:.9}

  .rsvp{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 118px);left:0;right:0;display:flex;justify-content:center}
  .rsvp .row{display:flex;gap:10px;width:min(86%,360px)}
  .btn{flex:1;appearance:none;border:1px solid rgba(255,255,255,.85);background:transparent;color:var(--white);
    font-family:var(--sans);font-weight:400;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    padding:14px 8px;cursor:pointer;transition:background .3s,color .3s}
  .btn.primary{background:var(--white);color:#141414}
  .btn:hover{background:rgba(255,255,255,.14)}
  .btn.primary:hover{background:#e9e9e9}
  .thanks{display:none;width:min(86%,360px);text-align:center;font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.35}
  .thanks small{display:block;margin-top:6px;font-family:var(--sans);font-style:normal;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
  .rsvp.done .row{display:none}
  .rsvp.done .thanks{display:block;animation:fade .8s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .nav{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 38px);left:50%;transform:translateX(-50%);width:min(92%,380px);
    display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.28);padding-top:12px}
  .is-revealed .nav{transform:translateX(-50%)}
  .nav.slide{transform:translate(-50%,60px)}
  .is-revealed .nav.slide{transform:translate(-50%,0)}
  .nav button{appearance:none;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;
    font-size:9px;letter-spacing:.16em;text-transform:uppercase;line-height:1.3;opacity:.92;padding:2px}
  .nav button:hover{opacity:1}
  .nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}

  .replay{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:14px;appearance:none;background:none;border:0;color:var(--white);
    font-size:9px;letter-spacing:.28em;text-transform:uppercase;opacity:0;cursor:pointer;padding:6px;transition:opacity 1s ease 3s}
  .is-revealed .replay{opacity:.6}

  /* ================= Envelope ================= */
  .envelope{position:absolute;inset:0;z-index:5;cursor:pointer}
  .is-open .envelope{pointer-events:none}
  .env-inner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  .flap-wrap{position:absolute;inset:0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
  .flap{position:absolute;inset:0;background:url(envelope.jpg?v=3) center/100% 100% no-repeat;transition:transform 1.5s var(--ease-io)}
  .flap.top{clip-path:polygon(0 0,100% 0,var(--cx) var(--cy))}
  .flap.bottom{clip-path:polygon(0 100%,100% 100%,var(--cx) var(--cy))}
  .flap.left{clip-path:polygon(0 0,0 100%,var(--cx) var(--cy))}
  .flap.right{clip-path:polygon(100% 0,100% 100%,var(--cx) var(--cy))}
  .is-open .flap.top{transform:translateY(-105%)}
  .is-open .flap.bottom{transform:translateY(105%)}
  .is-open .flap.left{transform:translateX(-105%);transition-delay:.12s}
  .is-open .flap.right{transform:translateX(105%);transition-delay:.12s}

  .seal-pos{position:absolute;left:var(--cx);top:var(--cy);width:37.9%;aspect-ratio:460/457;transform:translate(-50%,-50%);z-index:2}
  .seal{position:absolute;inset:0;
    filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45)) drop-shadow(0 6px 8px rgba(0,0,0,.28)) drop-shadow(0 16px 22px rgba(0,0,0,.22))}
  .seal .whole,.seal .half{position:absolute;inset:0;background:url(seal.png?v=3) center/100% 100% no-repeat}
  .seal .half{visibility:hidden;transition:transform 1.1s var(--ease-io),opacity 1s ease}
  .seal .half.l{clip-path:polygon(0 0,52% 0,46% 30%,54% 55%,47% 100%,0 100%)}
  .seal .half.r{clip-path:polygon(52% 0,100% 0,100% 100%,47% 100%,54% 55%,46% 30%)}
  .is-open .seal .half{visibility:visible}
  .is-open .seal .whole{visibility:hidden}
  .envelope:not(.pressed) .seal{animation:breathe 2.8s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  .pressed .seal{transform:scale(.94);transition:transform .25s ease}
  .is-open .seal .half.l{transform:translate(-55%,40%) rotate(-28deg);opacity:0}
  .is-open .seal .half.r{transform:translate(55%,40%) rotate(26deg);opacity:0}

  .hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 13%);z-index:6;text-align:center;pointer-events:none;
    font-family:var(--serif);font-style:italic;font-size:19px;color:#f3efe4;text-shadow:0 1px 10px rgba(0,0,0,.55);animation:hintIn 1.6s ease .6s both}
  .hint small{display:block;margin-top:8px;font-family:var(--sans);font-style:normal;font-size:9.5px;letter-spacing:.38em;text-transform:uppercase;opacity:.85}
  @keyframes hintIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .is-open .hint{opacity:0;transition:opacity .4s ease;animation:none}

  /* ================= Detail panels (paper) ================= */
  .panel{position:absolute;inset:0;z-index:20;color:var(--ink);background:#efe7d8 url(paper.jpg?v=3) center/cover;
    transform:translateX(100%);transition:transform .65s var(--ease-io),visibility 0s linear .65s;visibility:hidden;
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .panel.open{transform:none;visibility:visible;transition:transform .65s var(--ease-io),visibility 0s}
  .panel-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:linear-gradient(180deg,rgba(239,231,216,.96) 70%,rgba(239,231,216,0))}
  .back{appearance:none;background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 6px 8px 0;
    font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--green)}
  .back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .panel-bar .mini{font-family:'Pinyon Script',cursive;font-size:26px;color:var(--green);line-height:1}
  .panel-body{padding:8px 28px calc(env(safe-area-inset-bottom) + 48px)}
  .eyebrow{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
  .panel h2{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.1;margin:8px 0 6px;color:var(--ink)}
  .lead{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.45;color:var(--ink-soft)}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55;margin:24px 0}
  .panel h3{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--green);font-weight:400;margin-bottom:12px}
  .panel p{font-size:14.5px;line-height:1.6;font-weight:300}
  .panel p + p{margin-top:10px}
  .panel strong{font-weight:400;color:var(--ink)}

  .timeline{list-style:none;margin-top:4px}
  .timeline li{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:13px 0;border-bottom:1px solid rgba(168,138,74,.25)}
  .timeline li:last-child{border-bottom:0}
  .timeline time{font-family:var(--serif);font-size:19px;color:var(--green);line-height:1.2}
  .timeline b{display:block;font-weight:400;font-size:15px}
  .timeline span{display:block;font-size:12.5px;color:var(--ink-soft);font-weight:300;margin-top:2px}

  .swatches{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}
  .swatch{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;color:var(--ink-soft);text-transform:uppercase}
  .swatch i{width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:block}

  .pill{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:12px 18px;border:1px solid var(--green);color:var(--green);
    text-decoration:none;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;background:transparent;cursor:pointer}
  .pill.solid{background:var(--green);color:#f4efe4}
  .pill svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

  .hotel{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(168,138,74,.25)}
  .hotel:last-child{border-bottom:0}
  .hotel b{display:block;font-family:var(--serif);font-weight:500;font-size:19px}
  .hotel span{display:block;font-size:12.5px;color:var(--ink-soft);font-weight:300;margin-top:2px}
  .hotel a{flex:none;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--green);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}
  .code{display:inline-block;font-family:var(--sans);font-weight:400;letter-spacing:.18em;padding:2px 8px;border:1px dashed var(--gold);color:var(--green)}

  .gift{padding:22px 20px;border:1px solid rgba(168,138,74,.45);background:rgba(255,255,255,.35);margin-top:16px}
  .gift b{display:block;font-family:var(--serif);font-weight:500;font-size:22px;margin-bottom:6px}

  .pass{margin-top:22px;background:#fbf8f1;border:1px solid rgba(168,138,74,.5);box-shadow:0 10px 30px rgba(60,50,30,.12);position:relative}
  .pass-head{background:var(--green);color:#f4efe4;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
  .pass-head .pm{font-family:'Pinyon Script',cursive;font-size:30px;line-height:1}
  .pass-head small{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;opacity:.85;text-align:right;line-height:1.6}
  .pass-qr{padding:24px 0 14px;display:flex;justify-content:center}
  .pass-qr svg{width:190px;height:190px;display:block}
  .pass-qr svg rect[fill="#ffffff"]{fill:#fbf8f1}
  .pass-cut{height:0;border-top:1px dashed rgba(168,138,74,.6);margin:6px 18px;position:relative}
  .pass-cut:before,.pass-cut:after{content:"";position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:#efe7d8}
  .pass-cut:before{left:-30px}.pass-cut:after{right:-30px}
  .pass-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:16px 20px 22px}
  .pass-fields div{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft)}
  .pass-fields b{display:block;margin-top:5px;font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink)}
  .pass-fields .wide{grid-column:1/-1}

  .toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);z-index:40;opacity:0;pointer-events:none;
    background:rgba(30,30,28,.92);color:#f4efe4;font-size:11px;letter-spacing:.08em;padding:12px 18px;border-radius:999px;transition:opacity .3s,transform .3s;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  html[lang="ja"] .names,html[lang="ja"] .names small,html[lang="ja"] .when .meta,html[lang="ja"] .btn,html[lang="ja"] .nav button,
  html[lang="ja"] .eyebrow,html[lang="ja"] .panel h3,html[lang="ja"] .back,html[lang="ja"] .hint small{letter-spacing:.12em;text-indent:0}
  html[lang="ja"] .lead{font-style:normal;font-size:16px}
  html[lang="ja"] .when .day,html[lang="ja"] .hint,html[lang="ja"] .thanks{font-style:normal}

  @media (prefers-reduced-motion: reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<main class="stage" id="stage">

  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button><span>/</span><button type="button" data-lang="ja" aria-pressed="false">日本語</button>
  </div>

  <div class="photo" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <!-- ===== Main invitation ===== -->
  <section class="content" aria-label="Ada and Nate wedding invitation">
    <h1 class="names slide from-top d1">Ada &amp; Nate<small data-i18n="sub"></small></h1>

    <p class="side left slide from-left d3">Montage Deer Valley</p>
    <p class="side right slide from-right d3">Park City, Utah</p>

    <div class="mono" aria-hidden="true">
      <svg viewBox="0 0 200 250">
        <rect class="frame" x="40" y="10" width="120" height="230"/>
        <text class="letter a" x="30" y="114" font-size="115">A</text>
        <text class="letter n" x="48" y="188" font-size="115">N</text>
        <text class="date" x="0" y="58">06</text>
        <text class="date" x="0" y="80">12</text>
        <text class="date" x="200" y="196" text-anchor="end">20</text>
        <text class="date" x="200" y="218" text-anchor="end">27</text>
      </svg>
    </div>

    <div class="when slide from-bottom d2">
      <p class="day" data-i18n="day"></p>
      <p class="meta" data-i18n="meta"></p>
    </div>

    <div class="rsvp slide from-bottom d5" id="rsvp">
      <div class="row">
        <button class="btn primary" data-a="yes" data-i18n="yes"></button>
        <button class="btn" data-a="no" data-i18n="no"></button>
      </div>
      <p class="thanks" id="thanks"></p>
    </div>

    <nav class="nav slide from-bottom d6" aria-label="Details">
      <button type="button" data-open="schedule">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="1"/><path d="M3.5 9.5h17M8 3v4M16 3v4M8 13h3M8 16.5h6"/></svg>
        <span data-i18n="nav1"></span>
      </button>
      <button type="button" data-open="travel">
        <svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11A6.5 6.5 0 0 1 18.5 10c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
        <span data-i18n="nav2"></span>
      </button>
      <button type="button" data-open="registry">
        <svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="1"/><path d="M3 9h18M12 9v11M12 9c-1.5-3-5-4-5.5-2S9.5 9 12 9zM12 9c1.5-3 5-4 5.5-2S14.5 9 12 9z"/></svg>
        <span data-i18n="nav3"></span>
      </button>
      <button type="button" data-open="pass">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 14h2M14 18h2M18 18h2v2M16 16h2v2"/></svg>
        <span data-i18n="nav4"></span>
      </button>
    </nav>

    <button class="replay" id="replay" type="button" data-i18n="replay"></button>
  </section>

  <!-- ===== Envelope ===== -->
  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open the invitation">
    <div class="env-inner" id="envInner">
      <div class="flap-wrap"><div class="flap top"></div></div>
      <div class="flap-wrap"><div class="flap bottom"></div></div>
      <div class="flap-wrap"><div class="flap left"></div></div>
      <div class="flap-wrap"><div class="flap right"></div></div>

<script src="js/qrcode.js"></script>
<script>
(function(){
  /* ---------- Copy (English default, Japanese option) ---------- */
  var T={
    en:{
      hint:'Tap the seal to open',
      sub:'We are getting married',
      day:'Saturday, June 12, 2027',
      meta:'Ceremony at 5:00 PM',
      yes:'I’ll be there', no:'Can’t make it',
      ty_yes:'Thank you! We can’t wait to celebrate with you.',
      ty_no:'We will miss you. Thank you for letting us know.',
      nav1:'Schedule', nav2:'Travel & Stay', nav3:'Registry', nav4:'Your Pass',
      replay:'Replay', back:'Back',
      s_lead:'An evening in the mountains, from the first vow to the last dance.',
      t1:'4:30 PM', e1:'Guest arrival', p1:'Grand Lawn',
      t2:'5:00 PM', e2:'Ceremony',
      t3:'6:00 PM', e3:'Cocktail hour', p3:'Gallery Terrace',
      t4:'7:30 PM', e4:'Dinner', p4:'Grand Terrace',
      t5:'9:00 PM', e5:'First dance and party',
      t6:'12:00 AM', e6:'Farewell', p6:'Shuttles back to Main Street',
      dc_t:'Dress code', dc:'Black tie optional',
      dc_note:'The ceremony is outdoors at 8,300 feet. Evenings in the mountains get cool, so bring a wrap or a light jacket.',
      c1:'Sage', c2:'Ivory', c3:'Champagne', c4:'Charcoal',
      v_t:'The venue', maps:'Open in Maps',
      g_t:'Getting there',
      g1:'Salt Lake City International Airport (SLC) is about 27 miles away, roughly 40 minutes by car.',
      g2:'A shuttle will run between Main Street and the venue from 4:00 PM until the end of the night.',
      h_t:'Where to stay',
      h_block:'We have a room block at Montage Deer Valley. Use the code <span class="code">ADANATE27</span> when you book, before May 1, 2027.',
      h1:'Our venue · room block', h2:'Deer Valley · 5 min drive', h3:'Silver Lake Village · 5 min drive', h4:'Canyons Village · 25 min drive',
      visit:'Visit',
      r_eye:'With gratitude', r_lead:'Your presence is the greatest gift. If you would like to celebrate with something more, here are two ideas.',
      r1_t:'Honeymoon fund', r1:'Help us explore Kyoto and Hokkaido in the fall of 2027.', r1_b:'Contribute',
      r2_t:'Home registry', r2:'A short list of things for our first home together.', r2_b:'View list',
      demo:'Link coming soon',
      q_lead:'Show this pass at the entrance. Our team will scan it to check you in.',
      q_guest:'Guest', q_seats:'Seats', q_table:'Table', q_time:'Arrival', q_id:'Pass',
      q_default:'Your Name',
      q_note:'Every guest receives a personal link with their own pass. Take a screenshot to keep it handy on the day.'
    },
    ja:{
      hint:'封蝋をタップして開いてください',
      sub:'結婚します',
      day:'2027年6月12日（土）',
      meta:'挙式 午後5時',
      yes:'出席します', no:'欠席します',
      ty_yes:'ありがとうございます。当日お会いできるのを楽しみにしています。',
      ty_no:'ご連絡ありがとうございます。お会いできず残念です。',
      nav1:'当日の流れ', nav2:'アクセス・宿泊', nav3:'ギフト', nav4:'招待パス',
      replay:'もう一度', back:'戻る',
      s_lead:'誓いの言葉から最後のダンスまで、山あいで過ごすひとときです。',
      t1:'午後4:30', e1:'受付', p1:'グランド・ローン',
      t2:'午後5:00', e2:'挙式',
      t3:'午後6:00', e3:'カクテルアワー', p3:'ギャラリー・テラス',
      t4:'午後7:30', e4:'ディナー', p4:'グランド・テラス',
      t5:'午後9:00', e5:'ファーストダンス・パーティー',
      t6:'午前0:00', e6:'お開き', p6:'メインストリート行きシャトルあり',
      dc_t:'ドレスコード', dc:'ブラックタイ・オプショナル',
      dc_note:'挙式は標高約2,500メートルの屋外で行います。山の夜は冷えますので、羽織るものをお持ちください。',
      c1:'セージ', c2:'アイボリー', c3:'シャンパン', c4:'チャコール',
      v_t:'会場', maps:'地図を開く',
      g_t:'アクセス',
      g1:'ソルトレイクシティ国際空港（SLC）から約43km、車で約40分です。',
      g2:'午後4時からお開きまで、メインストリートと会場の間でシャトルを運行します。',
      h_t:'宿泊',
      h_block:'モンタージュ・ディアバレーに客室をご用意しています。2027年5月1日までに、ご予約の際にコード <span class="code">ADANATE27</span> をお伝えください。',
      h1:'会場 · ご優待客室あり', h2:'ディアバレー · 車で5分', h3:'シルバーレイク・ビレッジ · 車で5分', h4:'キャニオンズ・ビレッジ · 車で25分',
      visit:'公式サイト',
      r_eye:'感謝をこめて', r_lead:'ご出席いただけることが何よりの贈り物です。お祝いをお考えの方は、こちらをご覧ください。',
      r1_t:'ハネムーン基金', r1:'2027年秋、京都と北海道を巡る旅の資金に。', r1_b:'お祝いを送る',
      r2_t:'ギフトリスト', r2:'ふたりの新生活のためのギフトリストです。', r2_b:'リストを見る',
      demo:'リンクは近日公開予定です',
      q_lead:'受付でこのパスをご提示ください。スタッフがQRコードを読み取ります。',
      q_guest:'ゲスト', q_seats:'席数', q_table:'テーブル', q_time:'受付時間', q_id:'パス番号',
      q_default:'お名前',
      q_note:'ゲストごとに専用のリンクとパスをお送りします。当日すぐに提示できるよう、スクリーンショットで保存しておくと便利です。'
    }
  };

  var params=new URLSearchParams(location.search);
  var lang=params.get('lang')==='ja'?'ja':'en';
  try{ var saved=localStorage.getItem('an27-lang'); if(!params.get('lang') && (saved==='ja'||saved==='en')) lang=saved; }catch(e){}

  var guestName=params.get('g');
  var seats=parseInt(params.get('s'),10); if(!(seats>0&&seats<20)) seats=2;
  var passId='AN27-'+String(seats*71+((guestName||'').length*37)%900+100).padStart(4,'0');

  function t(k){ return (T[lang]&&T[lang][k])||T.en[k]||''; }

  function applyLang(){
    document.documentElement.lang=lang;
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent=t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){ el.innerHTML=t(el.getAttribute('data-i18n-html')); });
    document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang===lang?'true':'false'); });
    if(rsvp.classList.contains('done')) setThanks(lastAnswer);
    renderPass();
  }

  /* ---------- Envelope ---------- */
  var stage=document.getElementById('stage');
  var env=document.getElementById('envelope');
  var inner=document.getElementById('envInner');
  var IMG_W=1170, IMG_H=2096;
  function fit(){
    var s=Math.max(stage.clientWidth/IMG_W, stage.clientHeight/IMG_H);
    inner.style.width=(IMG_W*s)+'px'; inner.style.height=(IMG_H*s)+'px';
  }
  fit(); window.addEventListener('resize',fit);

  var opened=false;
  function open(){
    if(opened) return; opened=true;
    env.classList.add('pressed');
    setTimeout(function(){
      stage.classList.add('is-open');
      setTimeout(function(){ stage.classList.add('is-revealed'); },900);
    },260);
  }
  env.addEventListener('click',open);
  env.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();open();} });

  document.getElementById('replay').addEventListener('click',function(){
    stage.classList.remove('is-revealed','is-open');
    env.classList.remove('pressed');
    rsvp.classList.remove('done');
    opened=false;
  });

  /* ---------- RSVP ---------- */
  var rsvp=document.getElementById('rsvp');
  var thanks=document.getElementById('thanks');
  var lastAnswer='yes';
  function setThanks(a){
    thanks.innerHTML='';
    thanks.appendChild(document.createTextNode(t(a==='yes'?'ty_yes':'ty_no')));
  }
  rsvp.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]'); if(!b) return;
    lastAnswer=b.dataset.a; setThanks(lastAnswer); rsvp.classList.add('done');
  });

  /* ---------- Panels ---------- */
  var current=null;
  function openPanel(id){
    var p=document.getElementById('panel-'+id); if(!p) return;
    p.scrollTop=0; p.classList.add('open'); current=p;
    var back=p.querySelector('[data-close]'); setTimeout(function(){ back.focus({preventScroll:true}); },650);
  }
  function closePanel(){ if(current){ current.classList.remove('open'); current=null; } }
  document.querySelectorAll('[data-open]').forEach(function(b){ b.addEventListener('click',function(){ openPanel(b.dataset.open); }); });
  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click',closePanel); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closePanel(); });

  /* ---------- Toast for placeholder links ---------- */
  var toast=document.getElementById('toast'), toastTimer;
  document.querySelectorAll('[data-demo]').forEach(function(b){
    b.addEventListener('click',function(){
      toast.textContent=t('demo'); toast.classList.add('show');
      clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toast.classList.remove('show'); },2200);
    });
  });

  /* ---------- Guest pass with QR ---------- */
  function renderPass(){
    var name=guestName||t('q_default');
    document.getElementById('passName').textContent=name;
    document.getElementById('passSeats').textContent=seats;
    document.getElementById('passId').textContent=passId;
    try{
      qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];
      var q=qrcode(0,'M');
      q.addData('ADA-NATE-2027|'+passId+'|'+name+'|SEATS:'+seats+'|TABLE:7');
      q.make();
      document.getElementById('qr').innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});
    }catch(e){}
  }

  /* ---------- Language switch ---------- */
  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click',function(e){
      e.stopPropagation();
      lang=b.dataset.lang;
      try{ localStorage.setItem('an27-lang',lang); }catch(err){}
      applyLang();
    });
  });

  applyLang();
})();
</script>
