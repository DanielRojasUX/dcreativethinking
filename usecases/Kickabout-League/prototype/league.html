  </header>

    <div class="glass card"><div class="card__row"><span class="h3">Standings</span><span class="small mut">Win 3 · Draw 1 · Loss 0</span></div><table class="tbl num"><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody data-pstd></tbody></table></div>

<div class="app" style="position:fixed;inset:0;pointer-events:none;background:none;border-radius:0;z-index:100"></div>
<script src="js/data.js?v=20261127d"></script><script src="js/kick.js?v=20261127d"></script><script>{
const {app:A,$,icon,crest,teams:T}=KL;
let live=KL.loadLive();
function paint(){
  const s=KL.score(live);
  $('[data-vs]').innerHTML=`<div class="vs__t">${crest('HAL',44)}Halcones FC</div><div class="vs__s num">${s.HAL}<span>:</span>${s.TIG}</div><div class="vs__t">${crest('TIG',44)}Tigres del Norte</div>`;
  $('[data-plive]').textContent=live.status==='final'?'FULL TIME':`LIVE ${live.minute}'`;
  $('[data-pstd]').innerHTML=KL.table(live).map((t,i)=>`<tr><td>${i+1}</td><td><span class="team">${crest(t.k,20)}${T[t.k].name}</span></td><td>${t.P}</td><td>${t.W}</td><td>${t.D}</td><td>${t.L}</td><td>${t.GD>0?'+':''}${t.GD}</td><td class="pts">${t.Pts}</td></tr>`).join('');
}
$('[data-psco]').innerHTML=KL.scorers.slice(0,5).map((s,i)=>`<div class="li"><span class="dim num" style="width:16px">${i+1}</span><span class="li__main"><span class="li__t">${s.name}</span><span class="li__s team">${crest(s.t,16)}${T[s.t].short}</span></span><b class="h2 num">${s.g}</b></div>`).join('');
$('[data-pfix]').innerHTML=KL.fixtures.map(f=>`<div class="li"><span class="li__main">${KL.fx(f.h,f.a,18)}</span><span class="small mut num">${f.time} · ${f.field}</span></div>`).join('');
A.root=document.querySelector('.app');A.opt={noHash:true};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act="share"]');if(!b)return;KL.pop(b);try{navigator.clipboard.writeText(location.href)}catch(err){}KL.toast('Link copied','share');});
KL.onLive(v=>{live=v;paint();});paint();
}
</script></body></html>
